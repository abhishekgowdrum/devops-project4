- name: Deploy application
  hosts: webserver
  become: yes

  tasks:

    - name: Install Docker
      ansible.builtin.yum:
        name: docker
        state: present

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Pull Docker image
      community.docker.docker_image:
        name: nginx
        source: pull

    - name: Run Docker container
      community.docker.docker_container:
        name: myapp
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"
